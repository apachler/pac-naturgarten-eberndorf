name: Beetpläne prüfen

on:
  push:
    paths: ['Gemüsegarten/**', 'beetplaner/**', '.github/workflows/beetplan-pruefen.yml']
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Pläne prüfen
        run: node beetplaner/pruefen.mjs
