name: attribution
# Keine Werbung von Coding-Assistenten in der Historie: lehnt Co-Author-Trailer und "Generated with"-Fußzeilen
# in Commits und PR-Beschreibungen ab (übernommen aus apachler/violetveinsmp).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No coding-assistant attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='noreply@anthropic\.com|^Co-authored-by: (Claude|Copilot)|Generated with \[?(Claude Code|GitHub Copilot)|^Claude-Session:'
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            range="$HEAD -1"
          else
            range="$BASE..$HEAD"
          fi
          found=0
          # shellcheck disable=SC2086
          for sha in $(git rev-list $range); do
            if git show -s --format='%B' "$sha" | grep -qiE "$pattern"; then
              echo "::error::Commit $sha enthält Werbung/Attribution eines Coding-Assistenten."
              found=1
            fi
          done
          if printf '%s\n' "$PR_BODY" | grep -qiE "$pattern"; then
            echo "::error::Die PR-Beschreibung enthält Werbung/Attribution eines Coding-Assistenten."
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Attribution-Zeilen entfernen: git rebase -i $BASE mit reword, oder PR-Beschreibung bearbeiten."
            exit 1
          fi
          echo "Keine Attribution von Coding-Assistenten."
