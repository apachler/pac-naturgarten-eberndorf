# Kulturdatenbank – maschinenlesbares Kulturwissen
#
# Wird vom Beetplaner (Anzeige) und vom Prüf-Script (Abstände, Nachbarn,
# Fruchtfolge) verwendet. Erklärungen und Erfahrungen stehen in
# Kulturwissen.md und Erfahrungen.md – hier nur die Werte.
#
# Felder:
#   name        Anzeigename
#   familie     Pflanzenfamilie (für die Fruchtfolge)
#   symbol      Emoji für die Anzeige
#   farbe       Farbe im Beetplan
#   abstand     Pflanzabstand in der Reihe in cm (bestimmt die Kreisgröße)
#   reihe       Reihenabstand in cm (optional)
#   hoehe       ungefähre Wuchshöhe in cm
#   zehrer      stark | mittel | schwach
#   wasser      hoch | mittel | niedrig
#   gut         gute Nachbarn (IDs)
#   schlecht    schlechte Nachbarn (IDs) – werden beidseitig geprüft
#   frost       true = frostempfindlich, erst nach den Eisheiligen pflanzen

