# Kulturen – die eine Datenquelle (SSOT) für alle Gemüse- und Begleitpflanzen
#
# Alles, was wir über eine Art wissen, steht HIER und nur hier. Daraus entstehen:
#   - Grundlagen/Kulturwissen.md (Steckbriefe, erzeugt mit `npm run kulturwissen` – nicht von Hand bearbeiten)
#   - die Anzeige im Beetplaner (Detailblatt) und die automatische Prüfung (Abstände, Nachbarn, Frost, Fruchtfolge)
# Pflanzenfamilien und Anbaupausen: familien.yaml
#
# Pflichtfelder (werden von `npm test` geprüft):
#   name, botanisch, familie, symbol, farbe, rollen, abstand, hoehe, licht, boden, wurzel, zehrer, wasser,
#   anbau, ernte, naturjahreszeit
# Optional: reihe, frost, aussaat, pflanzung, gut, schlecht, schaedlinge, krankheiten, bedarf, hinweis,
#   sorten, erfahrungen, quellen
#
# Werte:
#   rollen          V Vorkultur · H Hauptkultur · N Nachkultur · B Beikraut (wofür die Art bei uns taugt)
#   abstand / reihe Pflanzabstand in der Reihe / Reihenabstand in cm; hoehe in cm
#   licht           sonnig | sonnig bis halbschattig | halbschattig
#   wurzel          flach | mittel | tief
#   zehrer          stark | mittel | schwach  (Nährstoffbedarf)
#   wasser          hoch | mittel | niedrig
#   frost           true = frostempfindlich, erst nach den Eisheiligen ins Freie
#   anbau           Direktsaat, Jungpflanze, Steckzwiebel …
#   naturjahreszeit ID der Naturjahreszeit für Aussaat/Pflanzung (preSpring … winter, siehe beetplaner/naturjahr.js)
#   gut / schlecht  IDs anderer Kulturen (schlechte Nachbarn werden beidseitig geprüft)
#   sorten          [{name, quelle, jahr, ergebnis}] – erprobte Sorten
#   erfahrungen     [{jahr, text, sicherheit}] – sicherheit: beobachtet | bestaetigt | hypothese
#                   „bestaetigt“ erst, wenn es sich in mindestens zwei Jahren gezeigt hat.
#
# Allgemeine Werte (Abstände, Termine, Nachbarn) sind Faustwerte aus der gängigen Gartenpraxis für Kärnten.
# Eigene Erfahrungen gehen vor: Werte anpassen, wenn sie sich bei uns anders zeigen, und das als Erfahrung notieren.

# ============================================================ Hülsenfrüchtler

feuerbohne:
  name: Feuerbohne
  botanisch: Phaseolus coccineus
  familie: Hülsenfrüchtler
  symbol: "🫘"
  farbe: "#7cb342"
  rollen: [H]
  abstand: 15
  reihe: 60
  hoehe: 300
  licht: sonnig
  boden: humos, warm, durchlässig; keine frische Düngung nötig
  wurzel: tief
  zehrer: schwach
  wasser: mittel
  frost: true
  anbau: Direktsaat, 4 Bohnen je Stange
  aussaat: nach den Eisheiligen, Mitte bis Ende Mai
  naturjahreszeit: earlySummer
  ernte: grün Juli–Oktober, Trockenbohnen ab September
  gut: [bohnenkraut, gurke, kohlrabi, rote_ruebe]
  schlecht: [sommerlauch, winterlauch, zwiebel, knoblauch]
  schaedlinge: [Schwarze Bohnenlaus, Schnecken an Keimlingen]
  krankheiten: [Brennfleckenkrankheit]
  hinweis: Hohe Kultur – an die Nordseite des Beetes, sonst beschattet sie alles.
  erfahrungen:
    - jahr: 2026
      text: 5 Stangen ganz am Nordrand brauchten viel Platz – 2027 mit 4 Stangen probieren.
      sicherheit: beobachtet
    - jahr: 2026
      text: Im Hitzesommer viele Blüten, aber kaum Schoten; Hauptansatz erst im Spätsommer, Ernte Anfang November teils noch grün. Vermutlich werden die Blüten bei großer Hitze steril. 2025 war das nicht so.
      sicherheit: hypothese

