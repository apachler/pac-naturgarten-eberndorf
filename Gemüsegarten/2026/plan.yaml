    kultur: feuerbohne
    flaeche: west
    typ: H
    wunsch: 20
    von: 2026-05-15
    bis: 2026-10-31
    punkte: [[30, 450], [90, 450], [150, 450], [210, 450], [270, 450]]
    je: 4
    notiz: 5 Stangen mit je 4 Bohnen
    ist:
      status: geerntet
      ernte: "+"
      notiz: >-
        Im Sommer viele Blüten, aber kaum Schoten (vermutlich Hitze). Hauptansatz erst im
        Spätsommer/Frühherbst, Ernte Anfang November, viele Schoten grün zum Nachtrocknen.

  - id: bohnenkraut
    kultur: bohnenkraut
    flaeche: west
    typ: B
    wunsch: 4
    von: 2026-05-15
    bis: 2026-09-30
    punkte: [[60, 420], [120, 420], [180, 420], [240, 420]]
    ist: { status: im_beet, ernte: "o", notiz: Geht einigermaßen. }

