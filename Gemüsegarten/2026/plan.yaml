      - { id: A, name: "Zone A – Feuerbohnen", y: 400, t: 100 }
      - { id: B, name: "Zone B – Kohlsprossen, Gurken, Sellerie", y: 290, t: 80 }
      - { id: C, name: "Zone C – Paprika, Pfefferoni, Mangold, Stangensellerie", y: 160, t: 100 }
      - { id: D, name: "Zone D – Karotten + Lauch + Dill", y: 80, t: 80 }
      - { id: E, name: "Zone E – Rote Rüben, Kohlrabi, Ringelblumen", y: 0, t: 80 }
    # Tatsächliche Einteilung 2026: Die Feuerbohnen standen ganz am Nordrand, Zone A war daher nur ca. 50 cm tief.
    # Die gewonnenen 50 cm gingen an Zone B (+30) und Zone C (+20); D und E blieben gleich.
    ist:
      wege:
        - { name: Pflegepfad 1, y: 420, t: 30 }
        - { name: Pflegepfad 2, y: 280, t: 30 }
      zonen:
        - { id: A, name: "Zone A – Feuerbohnen", y: 450, t: 50 }
        - { id: B, name: "Zone B – Kohlsprossen, Gurken, Sellerie", y: 310, t: 110 }
        - { id: C, name: "Zone C – Paprika, Pfefferoni, Mangold, Stangensellerie", y: 160, t: 120 }
        - { id: D, name: "Zone D – Karotten + Lauch + Dill", y: 80, t: 80 }
        - { id: E, name: "Zone E – Rote Rüben, Kohlrabi, Ringelblumen", y: 0, t: 80 }
