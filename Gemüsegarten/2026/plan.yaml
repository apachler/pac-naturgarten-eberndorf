# Beetplan 2026 – Datenquelle für den Beetplaner
#
# Übernommen aus der Planung 2026 (Mischkultur-Beetplanung.md, Positionsplan Kap. 6)
# und ergänzt um den Ist-Stand aus Rueckmeldung.md.
# Die Positionen entsprechen bewusst dem damaligen Plan, auch wo er Fehler hatte –
# das Prüf-Script zeigt diese als Warnungen an.
#
# Koordinaten in cm, Ursprung = Südwest-Ecke der Fläche (x nach Osten, y nach Norden).
# Zeiten: von = Saat/Pflanzung, bis = Ende der Ernte.
#
# Ort einer Pflanzung (eine der drei Formen):
#   punkte:  [[x, y], ...]           einzelne Pflanzen (mit "je: n" = n Pflanzen pro Punkt)
#   reihen:  [{y, x1, x2, anzahl}]   Pflanzen gleichmäßig auf einer Reihe verteilt
#            (oder {x, y1, y2, anzahl} für Nord–Süd-Reihen)
#   bereich: {x, y, b, t}            Fläche für Streusaat / ohne genaue Position
#            mischsaat: true = absichtlich zwischen anderen Kulturen (z. B. Markiersaat)
#
# Typ: V = Vorkultur, H = Hauptkultur, N = Nachkultur, B = Beikraut
# Ist-Status: geplant | gepflanzt | im_beet | geerntet | nicht_gepflanzt | unbekannt
# Ernte: "++" sehr gut, "+" gut, "o" mittel, "-" schlecht, "--" sehr schlecht

jahr: 2026

flaechen:
  west:
    rolle: aktiv
    wege:
      - { name: Pflegepfad 1, y: 370, t: 30 }
      - { name: Pflegepfad 2, y: 260, t: 30 }
    zonen:
      - { id: A, name: "Zone A – Feuerbohnen", y: 400, t: 100 }
      - { id: B, name: "Zone B – Kohlsprossen, Gurken, Sellerie", y: 290, t: 80 }
      - { id: C, name: "Zone C – Paprika, Pfefferoni, Mangold, Stangensellerie", y: 160, t: 100 }
      - { id: D, name: "Zone D – Karotten + Lauch + Dill", y: 80, t: 80 }
      - { id: E, name: "Zone E – Rote Rüben, Kohlrabi, Ringelblumen", y: 0, t: 80 }
  ost:
    rolle: ruhe
    notiz: Ruhejahr – Pflege mit Heu, Terra Preta und EM.
  tomatenhaus:
    rolle: aktiv

pflanzungen:

  # ---------------- Zone A ----------------
